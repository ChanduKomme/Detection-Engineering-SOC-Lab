# Author: Chandu Komme — CyberPulse SOC Lab
name: SOC Lab validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detection-as-code:
    name: Detection-as-code gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Sigma and ElastAlert2 rules
        run: python -m detectlab lint
      - name: Run detection unit tests
        run: python -m detectlab test -v
      - name: Check ATT&CK coverage artifacts are current
        run: python -m detectlab coverage --check
      - name: Run Python test suite
        run: python -m pytest -q tests
      - name: Check shell scripts and fixture syntax
        run: |
          bash -n setup.sh
          bash -n health-check.sh
          python -m json.tool fixtures/windows-auth.json >/dev/null
          python -m json.tool fixtures/network-replay.json >/dev/null
          python -m json.tool config/opensearch/index-template.json >/dev/null
          python -m json.tool detection-rules/attack-navigator-layer.json >/dev/null

  live-pipeline:
    name: Live SIEM replay
    needs: detection-as-code
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate the Vector configuration
        run: |
          docker run --rm \
            -e OPENSEARCH_INITIAL_ADMIN_PASSWORD=validate-only \
            -e VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true \
            -v "$PWD/config/vector/vector.toml:/etc/vector/vector.toml:ro" \
            timberio/vector:0.61.0-debian validate --no-environment /etc/vector/vector.toml
      - name: Start the lab
        run: ./setup.sh
      - name: Replay Windows and network telemetry and verify all live rules
        run: python3 tools/replay.py --report reports/replay.json
      - name: Build the incident case file
        run: python3 tools/case_report.py reports/replay.json -o reports/case.md
      - name: Triage alerts into scored incidents
        run: python3 tools/triage.py reports/replay.json -o reports/incidents.md --json reports/incidents.json
      - name: Check OpenSearch Dashboards responds
        run: |
          curl --fail --silent --show-error --retry 18 --retry-all-errors \
            --retry-delay 5 --max-time 5 http://127.0.0.1:5601/ >/dev/null
      - name: Upload replay evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replay-evidence
          path: |
            reports/replay.json
            reports/case.md
            reports/incidents.md
            reports/incidents.json
          if-no-files-found: error
      - name: Show logs after a failure
        if: failure()
        run: docker compose logs --tail 150
      - name: Stop the CI lab
        if: always()
        run: if [ -f .env ]; then docker compose down --volumes; fi
