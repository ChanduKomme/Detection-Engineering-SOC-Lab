title: Windows Failed Logon for Spray Correlation
name: windows_failed_logon_spray
id: 19d2a3a8-6117-416e-873c-a572acb426a7
status: test
description: Selects failed Windows Security logons with a target account for spray correlation.
author: Chandu Komme
date: 2026/11/17
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    TargetUserName|exists: true
  condition: selection
level: low
---
title: Password Spray from One Source
id: f36f4b96-8c22-4c09-91fd-bc4a563aad9b
status: test
description: >-
  Detects one source IP failing logons against five or more distinct accounts
  within ten minutes, the low-and-slow pattern that evades per-account lockout.
author: Chandu Komme
date: 2026/11/17
correlation:
  type: value_count
  rules: [windows_failed_logon_spray]
  group-by: [IpAddress]
  timespan: 10m
  condition:
    field: TargetUserName
    gte: 5
tags: [attack.credential_access, attack.t1110.003]
falsepositives:
  - A shared jump host or VDI gateway where many users mistype passwords.
  - An identity-management sync job using an expired service credential.
level: high
