title: WMIC Remote Process Creation
id: 4522160c-2496-5e6e-832c-b31d82d32288
status: experimental
description: Detects WMI usage for remote execution — common APT lateral movement
author: Chandu Komme (based on upstream rule by Sandeep Mothukuri)
tags: [attack.execution, attack.t1047, attack.lateral_movement]
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - '/node:'
      - 'process call create'
  condition: selection
level: high
falsepositives:
  - Approved remote administration tools and inventory jobs.
