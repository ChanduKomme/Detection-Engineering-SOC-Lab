title: Process Spawned Through WMI or Created Remotely With WMIC
id: ab0c24cb-31bf-4333-945c-b32445d9d831
status: test
description: >-
  Catches both ends of WMI execution. On the target, WmiPrvSE.exe spawns a shell
  or a living-off-the-land binary. On the source, wmic is run against a remote
  node with "process call create".
references:
  - https://attack.mitre.org/techniques/T1047/
author: Chandu Komme
date: 2026/11/17
tags: [attack.execution, attack.t1047]
logsource:
  product: windows
  category: process_creation
detection:
  wmi_child:
    ParentImage|endswith: '\WmiPrvSE.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\certutil.exe'
  remote_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - '/node:'
      - 'process'
      - 'call'
      - 'create'
  condition: wmi_child or remote_wmic
fields: [ParentImage, Image, CommandLine, User]
falsepositives:
  - Systems-management products that run inventory scripts through WMI.
level: high
