title: Failed Logon Burst for Breach Sequence
name: breach_failed_logon_burst
id: 175ed3ee-c8b7-4e1c-8008-47c42616ee1f
status: test
description: Ten or more failed logons from one source IP within five minutes.
author: Chandu Komme
