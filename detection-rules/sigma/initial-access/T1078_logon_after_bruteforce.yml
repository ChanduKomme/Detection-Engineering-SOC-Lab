level: medium
---
title: Successful Logon After Brute Force from the Same Source
id: a428987e-fb22-4b14-9ab2-7e021fbb2a44
status: test
description: >-
  Chains a failed-logon burst with a later successful logon from the same IP
  within ten minutes, the point where guessing likely became valid-account use.
author: Chandu Komme
date: 2026/11/17
correlation:
  type: temporal_ordered
  rules: [breach_failed_logon_burst, breach_successful_logon]
  group-by: [IpAddress]
  timespan: 10m
tags: [attack.initial_access, attack.t1078, attack.credential_access, attack.t1110.001]
falsepositives:
  - A user who forgot a recently changed password and then remembered it.
  - A service retrying a stale credential before an administrator fixed it.
level: critical
