title: Microsoft Defender Protection Turned Off or Exclusion Added
id: b4ce83f1-0010-454e-9010-ea36072946f7
status: test
description: >-
  Reads the Defender operational channel. It alerts when real-time, antimalware
  or antispyware protection is disabled, and when a configuration change adds a
  path or process exclusion or switches real-time monitoring off. Attackers often
  prefer exclusions because they draw less attention.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: Chandu Komme
date: 2026/11/17
tags: [attack.defense_evasion, attack.t1562.001]
logsource:
  product: windows
  service: windefend
detection:
  protection_disabled:
    EventID:
      - 5001
      - 5010
      - 5012
  config_change:
    EventID: 5007
  risky_change:
    NewValue|contains:
      - '\Exclusions\Paths\'
      - '\Exclusions\Processes\'
      - 'DisableRealtimeMonitoring = 0x1'
  condition: protection_disabled or (config_change and risky_change)
fields: [EventID, NewValue, OldValue]
falsepositives:
  - Administrators adding documented exclusions for line-of-business software.
level: high
