title: Autorun Registry Value Pointing at a User-Writable Path or Script Host
id: 897e9a08-d714-4456-b7a3-9d0b2f7baf22
status: test
description: >-
  Watches the Run, RunOnce and policy Run keys plus Winlogon Userinit and Shell.
  A new value only alerts when it launches something from a user-writable folder
  or through a script host, which is how commodity malware persists. Signed
  software updating its own autorun from Program Files stays quiet.
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: Chandu Komme
date: 2026/11/17
tags: [attack.persistence, attack.privilege_escalation, attack.t1547.001]
logsource:
  product: windows
  category: registry_set
detection:
  autorun_key:
    EventID: 13
    TargetObject|contains:
      - '\CurrentVersion\Run\'
      - '\CurrentVersion\RunOnce\'
      - '\CurrentVersion\RunOnceEx\'
      - '\Policies\Explorer\Run\'
      - '\Winlogon\Userinit'
      - '\Winlogon\Shell'
  writable_location:
    Details|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
      - '\Downloads\'
  script_host:
    Details|contains:
      - 'powershell'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'rundll32'
      - 'regsvr32'
  known_updater:
    Details|contains: '\AppData\Local\Microsoft\OneDrive\'
  condition: autorun_key and (writable_location or script_host) and not known_updater
fields: [TargetObject, Details, Image]
falsepositives:
  - Per-user installers such as chat or meeting clients that run from AppData.
level: high
