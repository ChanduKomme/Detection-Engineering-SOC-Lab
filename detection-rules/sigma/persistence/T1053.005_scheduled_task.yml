title: Script-Related Scheduled Task Creation
id: 087806d6-97c0-509b-93b2-019965851dbc
status: experimental
description: Detects creation of suspicious scheduled tasks for persistence
author: Chandu Komme (based on upstream rule by Sandeep Mothukuri)
tags: [attack.persistence, attack.t1053.005]
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
  keywords:
    TaskContent|contains:
      - 'powershell'
      - 'wscript'
      - 'cscript'
      - 'mshta'
      - 'rundll32'
      - 'regsvr32'
  condition: selection and keywords
level: high
falsepositives:
  - Scheduled administrative scripts and application updates.
