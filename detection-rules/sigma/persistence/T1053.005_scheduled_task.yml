title: Scheduled Task Created to Run a LOLBin, Hidden Task or User-Path Payload
id: 93e47aea-1ddd-40d6-ae94-ce27ff520a43
status: test
description: >-
  Reads the task XML from event 4698. It alerts when the action starts a
  living-off-the-land binary, runs from a user-writable folder, or the task is
  marked hidden. Each of these is rare for legitimate software and common for
  persistence.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Chandu Komme
date: 2026/11/17
tags: [attack.execution, attack.persistence, attack.t1053.005]
logsource:
  product: windows
  service: security
detection:
  task_created:
    EventID: 4698
  lolbin_action:
    TaskContent|contains:
      - 'powershell'
      - 'pwsh'
      - 'mshta'
      - 'rundll32'
      - 'regsvr32'
      - 'certutil'
      - 'bitsadmin'
      - 'wscript'
      - 'cscript'
  user_path_action:
    TaskContent|contains:
      - '\AppData\'
      - '\Users\Public\'
      - '\Temp\'
  hidden_task:
    TaskContent|contains: '<Hidden>true</Hidden>'
  condition: task_created and (lolbin_action or user_path_action or hidden_task)
fields: [TaskName, SubjectUserName, TaskContent]
falsepositives:
  - Administrative maintenance scripts scheduled through PowerShell.
level: high
