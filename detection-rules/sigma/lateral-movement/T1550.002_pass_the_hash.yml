title: Pass-the-Hash Attack
id: 1b98641c-89ae-5ac3-9e61-365309c2bb0b
status: experimental
description: Detects pass-the-hash attacks using harvested NTLM hashes
author: Chandu Komme (based on upstream rule by Sandeep Mothukuri)
tags: [attack.lateral_movement, attack.t1550.002]
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    AuthenticationPackageName: NTLM
    KeyLength: 0
  filter:
    SubjectUserName|endswith: '$'
  condition: selection and not filter
level: high
falsepositives:
  - Legacy or application-specific NTLM network logons.
