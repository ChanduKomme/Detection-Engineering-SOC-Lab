# CyberPulse SOC Lab — OpenSearch Dashboards configuration
# Author: Chandu Komme
#
# Replaces the image's default file, so the first block repeats its defaults.
# The rest applies the CyberPulse UI: dark navy + cyan theme, logo, favicon,
# login page, chart colors, and the SOC dashboard as the landing page.

# --- Image defaults --------------------------------------------------------
server.host: "0.0.0.0"
opensearch.hosts: ["https://opensearch:9200"]
opensearch.ssl.verificationMode: none
opensearch.username: kibanaserver
opensearch.password: kibanaserver
opensearch.requestHeadersWhitelist: [authorization, securitytenant]
opensearch_security.readonly_mode.roles: [kibana_read_only]
opensearch_security.cookie.secure: false

# One shared space, so the imported SOC dashboard is visible to every user.
opensearch_security.multitenancy.enabled: false

# --- CyberPulse branding ---------------------------------------------------
# Assets are mounted at /ui/cyberpulse/. Dashboards checks each URL from the
# server side, so they use the in-container port 5601.
opensearchDashboards.branding:
  applicationTitle: "CyberPulse SOC Lab"
  useExpandedHeader: false
  faviconUrl: "http://localhost:5601/ui/cyberpulse/favicon.svg"
  logo:
    defaultUrl: "http://localhost:5601/ui/cyberpulse/logo-dark.svg"
    darkModeUrl: "http://localhost:5601/ui/cyberpulse/logo-dark.svg"
  mark:
    defaultUrl: "http://localhost:5601/ui/cyberpulse/mark.svg"
    darkModeUrl: "http://localhost:5601/ui/cyberpulse/mark.svg"
  loadingLogo:
    defaultUrl: "http://localhost:5601/ui/cyberpulse/loading.svg"
    darkModeUrl: "http://localhost:5601/ui/cyberpulse/loading.svg"

# Login page
opensearch_security.ui.basicauth.login.title: "CyberPulse SOC Lab"
opensearch_security.ui.basicauth.login.subtitle: "Detection console by Chandu Komme. Sign in as admin with the password in .env."
opensearch_security.ui.basicauth.login.showbrandimage: true
opensearch_security.ui.basicauth.login.brandimage: "http://localhost:5601/ui/cyberpulse/mark.svg"

# --- Theme and colors ------------------------------------------------------
uiSettings:
  overrides:
    "theme:darkMode": true
    "defaultRoute": "/app/dashboards#/view/cyberpulse-soc-dashboard"
    "visualization:colorMapping": '{"windows.security":"#00E5FF","zeek.dns":"#8B5CF6","zeek.notice":"#FFB020","zeek.conn":"#14B8A6","suricata.eve":"#FF4D6D","failure":"#FF4D6D","success":"#22C55E","Count":"#00E5FF","Events":"#00E5FF","Alerts":"#FF4D6D"}'
