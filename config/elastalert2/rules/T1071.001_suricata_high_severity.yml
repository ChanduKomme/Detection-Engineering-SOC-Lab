# Author: Chandu Komme — CyberPulse SOC Lab
# Sigma source: detection-rules/sigma/network/T1071.001_suricata_high_severity.yml
name: "SOC-010 | T1071.001 | High-severity Suricata alert"
type: any
index: soc-logs-telemetry
timestamp_field: "@timestamp"
query_delay: {seconds: 20}
realert: {minutes: 15}
query_key: source.ip
filter:
  - term: {event.dataset: suricata.eve}
  - term: {event.category: alert}
  - range: {rule.severity: {lte: 2}}
include_match_in_root: true
alert: [debug]
