# Author: Chandu Komme — CyberPulse SOC Lab
# Sigma source: detection-rules/sigma/credential-access/T1110.003_password_spray.yml
name: "SOC-003 | T1110.003 | Password spray from one source"
type: cardinality
index: soc-logs-telemetry
timestamp_field: "@timestamp"
cardinality_field: user.name
# ElastAlert2 fires when the distinct count exceeds max_cardinality: 5+ accounts.
max_cardinality: 4
timeframe: {minutes: 10}
query_delay: {seconds: 10}
realert: {minutes: 15}
query_key: source.ip
filter:
  - term: {event.dataset: windows.security}
  - term: {event.code: "4625"}
  - term: {event.outcome: failure}
  - exists: {field: user.name}
include_match_in_root: true
alert: [debug]
