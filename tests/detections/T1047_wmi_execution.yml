# Author: Chandu Komme
rule: detection-rules/sigma/execution/T1047_wmi_execution.yml
cases:
  - name: remote process creation with WMIC
    expect: match
    events:
      - event: {Image: 'C:\Windows\System32\wbem\WMIC.exe', CommandLine: 'wmic /node:10.0.0.5 process call create "cmd.exe /c whoami"'}
  - name: local WMIC query lacks the remote node flag
    expect: no_match
    events:
      - event: {Image: 'C:\Windows\System32\wbem\WMIC.exe', CommandLine: 'wmic process call create notepad.exe'}
  - name: inventory query
    expect: no_match
    events:
      - event: {Image: 'C:\Windows\System32\wbem\WMIC.exe', CommandLine: 'wmic /node:10.0.0.5 os get caption'}
