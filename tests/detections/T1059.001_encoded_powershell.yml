# Author: Chandu Komme
rule: detection-rules/sigma/execution/T1059.001_encoded_powershell.yml
cases:
  - name: full -EncodedCommand flag
    expect: match
    events:
      - event: {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', CommandLine: 'powershell.exe -NoProfile -EncodedCommand SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoA'}
  - name: shortest -e abbreviation
    expect: match
    events:
      - event: {Image: 'C:\Program Files\PowerShell\7\pwsh.exe', CommandLine: 'pwsh -e SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoA'}
  - name: renamed PowerShell identified by original file name
    expect: match
    events:
      - event: {Image: 'C:\Users\Public\notepad.exe', OriginalFileName: 'PowerShell.EXE', CommandLine: 'notepad.exe -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoA'}
  - name: script file without encoding
    expect: no_match
    events:
      - event: {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', CommandLine: 'powershell.exe -ExecutionPolicy Bypass -File C:\Scripts\backup.ps1'}
  - name: -ExecutionPolicy is not an encoded flag
    expect: no_match
    events:
      - event: {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', CommandLine: 'powershell.exe -ep bypass -c Get-Date'}
  - name: encoded flag on a non-PowerShell program
    expect: no_match
    events:
      - event: {Image: 'C:\Tools\custom.exe', OriginalFileName: 'custom.exe', CommandLine: 'custom.exe -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoA'}
