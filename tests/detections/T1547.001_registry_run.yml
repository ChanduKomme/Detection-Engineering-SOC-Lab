# Author: Chandu Komme
rule: detection-rules/sigma/persistence/T1547.001_registry_run.yml
cases:
  - name: value written under the Run key
    expect: match
    events:
      - event: {TargetObject: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\updater', Details: 'C:\Users\Public\u.exe'}
  - name: unrelated registry write
    expect: no_match
    events:
      - event: {TargetObject: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\Hidden'}
