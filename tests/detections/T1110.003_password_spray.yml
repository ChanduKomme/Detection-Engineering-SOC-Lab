# Author: Chandu Komme
rule: detection-rules/sigma/credential-access/T1110.003_password_spray.yml
cases:
  - name: one source fails against six accounts
    expect: match
    events:
      - repeat: 6
        every: 30s
        event: {EventID: 4625, IpAddress: 198.51.100.7, TargetUserName: "user{i}"}
  - name: four accounts stays below threshold
    expect: no_match
    events:
      - repeat: 4
        every: 30s
        event: {EventID: 4625, IpAddress: 198.51.100.7, TargetUserName: "user{i}"}
  - name: many failures against a single account is brute force, not spray
    expect: no_match
    events:
      - repeat: 20
        event: {EventID: 4625, IpAddress: 198.51.100.7, TargetUserName: alice}
  - name: accounts spread over more than ten minutes
    expect: no_match
    events:
      - repeat: 6
        every: 3m
        event: {EventID: 4625, IpAddress: 198.51.100.7, TargetUserName: "user{i}"}
  - name: six users each from their own source
    expect: no_match
    events:
      - repeat: 6
        event: {EventID: 4625, IpAddress: "198.51.100.{i}", TargetUserName: "user{i}"}
